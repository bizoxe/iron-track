name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_LOCKED: "1"
  PYTHON_VERSION: "3.12"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate tag format
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format: $TAG"
            echo "Expected format: vX.Y.Z (e.g., v0.2.0)"
            exit 1
          fi
          echo "Valid tag: $TAG"

  validate-code:
    name: Pre-commit Checks
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --no-default-groups --group linting
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Run Tests
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --no-default-groups --group test
      - name: Run tests
        run: uv run pytest tests -v

  release:
    name: Create GitHub Release
    needs: [validate-code, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build package
        run: uv build

      - name: Generate Release Notes
        uses: orhun/git-cliff-action@v4.9.1
        with:
          config: pyproject.toml
          args: --latest --strip header --output RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker Image Smoke Test
    needs: [validate-code, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --tag iron-track:smoke --file deploy/app/run/Dockerfile .

      - name: Smoke test (container starts, app imports)
        run: |
          set -a
          source .env.testing
          set +a
          docker run --rm --entrypoint python -e "JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}" iron-track:smoke \
            -c "from app.main import app; print('smoke ok:', len(app.routes), 'routes')"