# Optimized for 12GB+ RAM. If using less, scale shared_buffers and effective_cache_size accordingly.
# --- General Network and Security ---
listen_addresses = '*'
port = 5432
max_connections = 250
password_encryption = scram-sha-256
# Resolves the auth policy from the same mounted directory as this config file
# (default would be $PGDATA/pg_hba.conf, which is only written at first init).
hba_file = '/etc/postgresql/pg_hba.conf'

# --- Extensions and Monitoring ---
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = top

# --- Memory Settings ---
shared_buffers = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB

# --- Planner Tuning ---
effective_cache_size = 6GB
random_page_cost = 4.0
seq_page_cost = 1.0
default_statistics_target = 500

# --- Write Ahead Log (WAL) & Performance ---
# Asynchronous commit: trades durability for write latency on HDD.
# On crash up to ~600ms (3 x wal_writer_delay) of committed transactions may be
# lost; atomicity and consistency are unaffected. Revisit when moving to SSD.
synchronous_commit = off
wal_buffers = 16MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 4GB

# --- Logging and Timezone ---
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000
timezone = 'UTC'